<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100">
  <!-- No rounded corners, gradients, or inset borders. -->
  <rect id="pinentry-button-normal" width="10" height="10" fill="#89b4fa"/>
  <rect id="pinentry-button-focused" width="10" height="10" fill="#a6e3a1"/>
  <rect id="pinentry-button-pressed" width="10" height="10" fill="#74c7ec"/>
  <rect id="pinentry-button-toggled" width="10" height="10" fill="#74c7ec"/>
  <rect id="pinentry-button-disabled" width="10" height="10" fill="#313244"/>
  <rect id="pinentry-input-normal" width="10" height="10" fill="#313244"/>
  <rect id="pinentry-input-focused" width="10" height="10" fill="#45475a"/>
  <rect id="pinentry-input-pressed" width="10" height="10" fill="#45475a"/>
  <rect id="pinentry-input-disabled" width="10" height="10" fill="#181825"/>
  <!-- Keyboard focus is distinct from the green hover state. -->
  <g fill="#f5c2e7">
    <rect id="pinentry-focus-normal-top" width="10" height="2"/>
    <rect id="pinentry-focus-normal-bottom" width="10" height="2"/>
    <rect id="pinentry-focus-normal-left" width="2" height="10"/>
    <rect id="pinentry-focus-normal-right" width="2" height="10"/>
    <rect id="pinentry-focus-normal-topleft" width="2" height="2"/>
    <rect id="pinentry-focus-normal-topright" width="2" height="2"/>
    <rect id="pinentry-focus-normal-bottomleft" width="2" height="2"/>
    <rect id="pinentry-focus-normal-bottomright" width="2" height="2"/>
  </g>
</svg>
